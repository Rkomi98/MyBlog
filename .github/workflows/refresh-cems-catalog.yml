name: Refresh Copernicus EMS catalog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run cems:refresh
      - run: npm run test:cems
      - run: npm run deploy
        env:
          GH_TOKEN: ${{ github.token }}
